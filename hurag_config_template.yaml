# 自定义配置项，可选项不提供值则使用系统默认值。
# 若要提供自定义配置，请在对应配置项后填写，字符串使用双引号

# Milvus 向量数据库
milvus:
  uri:                # 默认 "http://localhost:19530"
  token:              # 必配项，格式为 "用户名:用户密码"，无默认值
  db_name:            # 必配项，Milvus 数据库名称，无默认值

# MariaDB/MySQL 关系型数据库
mariadb:
  host:               # 默认 "localhost"
  port:               # 默认 3306
  user:               # 必配项，无默认值
  password:           # 必配项，无默认值
  database:           # 必配项，MySQL/MairaDB 数据库名称，无默认值

# 日志文件
log:
  log_in_file:        # bool，是否启用文件日志，默认 False
  max_bytes:          # 整型，单个日志文件最大字节长度，默认 10 MB
  backup_count:       # 整型，保留日志文件数量，默认 5

# 应用相关配置
app:
  org_path:           # 机构全路径，如 "/总部/大区/分公司"，默认"未知机构"
  extra_docs_dir:     # 存放非向量化知识文档的相对路径，相对于当前项目路径

# 检索召回相关配置
retrieval:
  top_k:              # 最大召回数，默认 10
  top_a:              # 图谱关联搜索最大召回数，默认 50
  top_s:              # 向量混合搜索最大召回数，默认 20
  rrf_k:              # 混合搜索算法 RRF_Ranker 系数，默认 60
  top_g:              # 图搜索最大召回数，默认 20
  max_depth:          # 图搜索算法最大深度，默认 1
  max_comms:          # 图搜索算法最大社区数，默认 3
  max_nodes:          # 图搜索算法最大返回节点数，默认 1000
  # 以下配置项用于 agentic RAG 的检索用 tools
  # agentic RAG 不再支持 naive, mix, community, global 等传统检索模式，
  # 在智能体 tools 调用发起向量库内知识段落搜索时，默认采用统一的新搜索算法，即：
  # 1. 提取 low level keywords 和 high level keywords，分别用 ", " 连接为字符串;
  # 2. 使用 low level keywords 字符串搜索最相似的 entity_top_k 个 entities
  #    及其直接关联的 relations，得到 local entities (相似度排序) 和
  #    local relations (先 entities 相似度，后 relation weight 排序);
  # 3. 使用 high level keywords 字符串搜索最相似的 relation_top_k 个 relations
  #    及其两个端点上的 entities，得到 global entities (按 relations 序先 src 后 tgt)
  #    和 global relations (相似度排序);
  # 4. 使用 query 搜索最相似的 segment_top_k 个 query_segments (相似度序);
  # 5. 使用 Round-robin 归并 local entities 和 global entities，得到 final entities：
  #    - 按照先 local 后 global 的次序，从向量相似度由高到低逐个抽取；
  #    - 如有重复直接跳过。
  # 6. 使用 Round-robin 归并 local 和 global relations 为 final relations;
  # 7. 归并根据 query 搜索得到的 segments 和 final entities, final relations 上引用
  #    的 segments：
  #    - 在 final entities 所引用的所有 segments 中搜索最多 2 倍于实体数的与 query
  #      最相似的 entity_segments;
  #    - 在 final relations 所引用的所有 segments 中做同样的搜索，在搜索前先依照上
  #      一步得到的 entity_segments 进行去重，得到 relation_segments;
  #    - 使用 Round-robin 归并 query_segments, entity_segments, relation_segments
  #    - rerank 最终的 segments，返回前 segment_top_k 个。
  entity_top_k:       # 默认 40
  relation_top_k:     # 默认 40
  segment_top_k:      # 默认 20

# LLM 配置，在 .env 中配置与此处名称对应的大模型访问参数环境变量
llm:
  generation:         # 必配项，用于生成问答，建议采用高性能大尺寸LLM
  extraction:         # 必配项，用于知识提取，可以采用中等尺寸LLM
  multimodal:         # 必配项，用于多模态文档理解和智能体会话
  embedding:          # HuRAG EmbeddingService URL，默认 "http://localhost:8765"

# API Server 配置
api:
  host:               # API server 监听地址，默认 0.0.0.0
  port:               # API server 监听端口，默认 5000

# WebUI 数据库配置
webui_db:
  host:               # 默认 "localhost"
  port:               # 默认 3306
  user:               # 必配项，无默认值
  password:           # 必配项，无默认值
  database:           # 必配项，HuRAG WebUI 使用的 MySQL/MairaDB 数据库名称，无默认值

# WebUI 应用环境配置
webui_app:
  sso:                # 用户认证服务，若有则配置接口信息，默认采用简单模式则无需配置
  ctx_size:           # 3种生成模型上下文规模："tiny", "medium", "large"，默认 large
  host:               # WebUI App 监听地址，默认 0.0.0.0
  port:               # API server 监听端口，默认 8000
