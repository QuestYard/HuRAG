[project]
name = "HuRAG"
version = "0.3.1"
description = "HuRAG, A TH-GraphRAG Application From QuestYard."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiofiles>=25.1.0",
    "aiomysql>=0.3.2",
    "fastapi>=0.123.0",
    "gunicorn>=23.0.0",
    "igraph>=1.0.0",
    "json-repair>=0.54.2",
    "langchain-text-splitters>=1.0.0",
    "markitdown[all]>=0.1.4",
    "openai>=2.8.1",
    "pymilvus>=2.6.4",
    "python-dotenv>=1.2.1",
    "pyyaml>=6.0.3",
    "typer>=0.20.0",
    "uuid6>=2025.0.1",
    "uvicorn>=0.38.0",
    "pydantic-ai>=1.30.1",
    "scipy>=1.17.0",
    "bm25s>=0.2.14",
    "html-sanitizer>=2.6.0",
    "jieba>=0.42.1",
    "latex2mathml>=3.78.1",
    "mdformat>=1.0.0",
    "nicegui>=3.7.1",
]

[project.scripts]
hurag = "hurag.cli.kb_cli:app"
corpus = "hurag.cli.corpus_cli:app"
kgraph = "hurag.cli.kg_cli:app"
hurag-server = "hurag.hurag_server.server:main"
hurag-webui = "hurag.hurag_webui.main:start"

[build-system]
requires = ["uv_build>=0.9.13,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "matplotlib>=3.10.7",
]
