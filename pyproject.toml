[project]
name = "HuRAG"
version = "0.1.0"
description = "HuRAG 1.0, A TH-GraphRAG Application From QuestYard."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiomysql>=0.3.2",
    "fastapi>=0.123.0",
    "gunicorn>=23.0.0",
    "igraph>=1.0.0",
    "json-repair>=0.54.2",
    "langchain-text-splitters>=1.0.0",
    "markitdown[all]>=0.1.3",
    "openai>=2.8.1",
    "pymilvus>=2.6.4",
    "pymilvus-model>=0.3.2",
    "typer>=0.20.0",
    "uuid6>=2025.0.1",
    "uvicorn>=0.38.0",
]

[build-system]
requires = ["uv_build>=0.9.13,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "matplotlib>=3.10.7",
]

[tool.uv.sources]
torchvision = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cu130", marker = "sys_platform != 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

